<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F3F5F4">
    <title>Offline · Packen</title>
    <style>
        :root { --bg: #F3F5F4; --surface: #FFFFFF; --ink: #17211E; --muted: #5A6662; --line: #DDE3E0; --accent: #0E6B5E; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
               font-family: ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        .card { max-width: 380px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
        h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
        p { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
        a { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 20px; border-radius: 10px;
            background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Du bist offline</h1>
        <p>Diese Seite war noch nicht auf dem Gerät gespeichert. Reisen, die du einmal mit Netz geöffnet hast, funktionieren auch ohne – inklusive Abhaken.</p>
        <a href="/">Zu deinen Reisen</a>
    </div>
</body>
</html>
